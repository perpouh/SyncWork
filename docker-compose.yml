services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - ./backend:/app
      - bundle:/usr/local/bundle
      - tmp:/app/tmp
      - public:/app/public
      - log:/app/log
    ports:
      - "3000:3000"
    environment:
      RAILS_ENV: development
      DB_USER: root
      DB_PASSWORD: password
      DB_HOST: db
      DB_DATABASE: app_development
    depends_on:
      - db
    command: >
      /bin/bash -c "mkdir -p /app/log && touch /app/log/development.log && chmod -R 777 /app/log && bundle exec rails s"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    volumes:
      - ./frontend:/app
    ports:
      - "8080:8080"

  db:
    image: mysql:8.0
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: app_development
      TZ: Asia/Tokyo
    volumes:
      - ./containers/mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    command: --innodb-use-native-aio=0

  nginx:
    build: ./containers/nginx
    command: >
      /bin/bash -c
      "envsubst '$$NGINX_SERVER_NAME $$NGINX_SERVER_PORT' < /etc/nginx/nginx.conf.template > /etc/nginx/nginx.conf
      && nginx -g 'daemon off;'"
    environment:
      - TZ=Asia/Tokyo
      - NGINX_SERVER_NAME=localhost
      - NGINX_SERVER_PORT=80
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - tmp:/app/tmp
      - public:/app/public
    depends_on:
      - backend

volumes:
  mysql_data:
  bundle:
  tmp:
  public:
  log:
